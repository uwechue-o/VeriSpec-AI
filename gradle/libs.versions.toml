# VeriSpec-AI version catalog — the single source of dependency truth.
#
# Toolchain note: AGP is pinned to 8.7.x because the installed Android Studio
# (Ladybug 2024.2) refuses to open newer AGPs. compileSdk/targetSdk are 36.
#
# The AndroidX versions below are deliberately the ones contemporary with AGP
# 8.7 rather than the newest available. AndroidX ships lint checks inside its
# artifacts, and the 2025-era checks (Compose runtime's RememberInComposition
# and FrequentlyChangingValue, lifecycle's NullSafeMutableLiveData) are compiled
# against a newer Kotlin analysis API than the lint bundled with AGP 8.7. They
# throw IncompatibleClassChangeError mid-analysis and abort the build. Matching
# the era keeps every lint check running instead of suppressing them one by one.
#
# Raise `agp` and this whole AndroidX block together, once Android Studio is
# updated. Everything outside AndroidX is on its current stable release.

[versions]
agp = "8.7.3"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
hilt = "2.57.1"
androidxHilt = "1.2.0"
room = "2.7.2"   # 2.7+ required: earlier Room processors reject KSP2, which Kotlin 2.2 uses
work = "2.9.1"
datastore = "1.1.1"
navigation = "2.8.4"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
composeBom = "2024.10.01"
tracing = "1.2.0"
coroutines = "1.10.2"
serialization = "1.9.0"
datetime = "0.7.1"
okio = "3.15.0"
arrow = "2.1.2"
vico = "2.1.2"
litert = "1.4.0"
mediapipeGenai = "0.10.27"
executorch = "1.4.0"
tink = "1.18.0"
bouncycastle = "1.81"
pdfbox = "3.0.5"
xchart = "3.8.8"
kaml = "0.85.0"
jsonSchemaValidator = "1.5.8"
clikt = "5.0.3"
mordant = "3.0.2"
adam = "0.5.10"
multik = "0.2.3"
commonsMath = "3.6.1"
slf4j = "2.0.19"
junitJupiter = "5.13.4"
junit4 = "4.13.2"
kotest = "5.9.1"
mockk = "1.14.5"
turbine = "1.2.1"
robolectric = "4.15.1"
truth = "1.4.4"
androidxTestExt = "1.2.1"
espresso = "3.6.1"
kover = "0.9.1"
detekt = "1.23.8"
bcv = "0.18.1"

# SDK levels
compileSdk = "36"
targetSdk = "36"
minSdk = "29"

[libraries]
# --- Kotlin / kotlinx
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
arrow-core = { group = "io.arrow-kt", name = "arrow-core", version.ref = "arrow" }

# --- DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-core = { group = "com.google.dagger", name = "hilt-core", version.ref = "hilt" }
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "hilt" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

# --- Android UI
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# --- Persistence / execution
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-tracing-ktx = { group = "androidx.tracing", name = "tracing-ktx", version.ref = "tracing" }

# --- Inference runtimes
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
litert-gpu = { group = "com.google.ai.edge.litert", name = "litert-gpu", version.ref = "litert" }
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeGenai" }
executorch-android = { group = "org.pytorch", name = "executorch-android", version.ref = "executorch" }

# --- Crypto / provenance
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

# --- Reporting / catalog
pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "pdfbox" }
xchart = { group = "org.knowm.xchart", name = "xchart", version.ref = "xchart" }
kaml = { group = "com.charleskorn.kaml", name = "kaml", version.ref = "kaml" }
json-schema-validator = { group = "com.networknt", name = "json-schema-validator", version.ref = "jsonSchemaValidator" }

# --- CLI / fleet
clikt = { group = "com.github.ajalt.clikt", name = "clikt", version.ref = "clikt" }
mordant = { group = "com.github.ajalt.mordant", name = "mordant", version.ref = "mordant" }
adam = { group = "com.malinskiy.adam", name = "adam", version.ref = "adam" }

# --- Numerics
multik-core = { group = "org.jetbrains.kotlinx", name = "multik-core", version.ref = "multik" }
multik-default = { group = "org.jetbrains.kotlinx", name = "multik-default", version.ref = "multik" }
commons-math3 = { group = "org.apache.commons", name = "commons-math3", version.ref = "commonsMath" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }

# --- Testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }
kotest-assertions = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# --- Gradle plugin artifacts consumed by build-logic
plugin-android-gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
plugin-kotlin-gradle = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-kotlin-compose = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

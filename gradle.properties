# ---- JVM ----
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.x was validated by Google up to compileSdk 35; we build against 36.
android.suppressUnsupportedCompileSdk=36

# ---- Kotlin ----
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# ---- VeriSpec build switches ----
# The llama.cpp JNI adapter needs the NDK + CMake and a llama.cpp checkout. The
# pinned checkout is the git submodule third_party/llama.cpp: when it is present
# (git submodule update --init) the native build turns on by itself; without it
# the project still builds and the adapter reports its backend as absent (a
# recorded gap, never a crash). Set verispec.nativeLlama=true or false to force
# either way, and verispec.llamaCppDir to build against another checkout.
#verispec.nativeLlama=
#verispec.llamaCppDir=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
